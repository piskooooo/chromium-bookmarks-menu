<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <div id="head">
      <input
        id="search"
        type="text"
        placeholder="Search bookmarks"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <div id="list" role="tree" aria-label="Bookmarks"></div>
    <div id="foot">
      <button id="manage" type="button">Manage bookmarks</button>
      <span id="hint" role="status"></span>
    </div>
    <script type="module" src="menu.js"></script>
  </body>
</html>
