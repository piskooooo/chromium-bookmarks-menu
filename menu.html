<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <div id="head">
      <div id="top">
        <input
          id="search"
          type="text"

          spellcheck="false"

      <div id="hint" role="status"></div>

    <div id="list" role="tree" aria-label="Bookmarks"></div>
    <script type="module" src="menu.js"></script>
  </body>
</html>
